# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    # HTTP 服务器 - 重定向到 HTTPS
    server {
        listen       80;
        listen       [::]:80;
        server_name  si4key.com www.si4key.com;
        root         /usr/share/nginx/html;
        index        index.html;
        
        # 重定向到 HTTPS
        return 301 https://$host$request_uri;
        
        # 错误页面配置
        error_page 404 /404.html;
        location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }

    # HTTPS 服务器 - 主配置
    server {
        listen 443 ssl;
        server_name si4key.com www.si4key.com;

        # SSL 证书配置
        ssl_certificate /etc/letsencrypt/live/si4key.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/si4key.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 站点根目录
        root /usr/share/nginx/html;
        index index.html;

        # 主站点请求处理
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Django 应用的静态文件
        location /api/si4locker/static/ {
            alias /root/remotelocker_api/staticfiles/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Django 应用 API 路由 - 所有 /api/si4locker/ 开头的请求都由此块处理
        location /api/si4locker/ {
            # URL 重写规则：从请求 URI 中移除 /api/si4locker/ 前缀
            # 例如：/api/si4locker/check_lock/ 转换为 /check_lock/
            # 这样 Django 应用就能够正确处理路径，因为 Django 可能不知道它被部署在子路径下
            # break 表示重写后停止处理其他重写规则
            rewrite ^/api/si4locker/(.*)$ /$1 break;

            # 代理设置 - 传递重要的 HTTP 头信息给后端应用
            # 将客户端的 Host 头传递给后端，使后端应用知道原始请求的主机名
            proxy_set_header Host $http_host;
            
            # 传递客户端真实 IP 地址，便于后端记录日志和处理基于 IP 的逻辑
            proxy_set_header X-Real-IP $remote_addr;
            
            # 传递完整的客户端 IP 链（如通过多个代理）
            # 格式：client_ip, proxy1_ip, proxy2_ip
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 传递原始请求协议（http 或 https），便于后端生成正确的绝对 URL
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 修正: 使用正确的 Unix 套接字路径，不要使用 TCP 端口
            proxy_pass http://unix:/root/remotelocker_api/remotelocker.sock;
        }
        
        # 错误页面配置
        error_page 404 /404.html;
        location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }
}

