{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">锁定确认成功</h3>
                </div>
                <div class="card-body">
                    <h5 class="card-title">设备 {{ device_id }} 的锁定状态已确认</h5>
                    <p class="card-text">上次确认时间: {{ last_checked }}</p>
                    <a href="{% url 'lock_page' device_id=device_id %}" class="btn btn-primary mt-3">返回锁定页面</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
