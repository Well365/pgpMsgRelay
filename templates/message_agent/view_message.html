{% extends 'base.html' %}

{% block title %}查看 OpenPGP 消息 | OpenPGP 中转站{% endblock %}

{% block content %}
<h2 class="mb-4">OpenPGP 消息</h2>

{% if one_time %}
<div class="alert alert-warning mb-3">
    <strong>注意:</strong> 这是一条一次性消息，查看后将被立即删除。
</div>
{% endif %}

{% if note %}
<div class="alert alert-info mb-3">
    <strong>备注:</strong> {{ note }}
</div>
{% endif %}

<div class="mb-3">
    <label class="form-label">加密消息内容:</label>
    <div class="position-relative">
        <pre id="message-content">{{ message }}</pre>
        <button class="btn btn-sm btn-outline-secondary position-absolute top-0 end-0 m-2" onclick="copyMessage()">复制</button>
    </div>
</div>

<div class="d-flex justify-content-between mt-4">
    <a href="{% url 'message_agent:create_message' %}" class="btn btn-primary">创建新消息</a>
</div>
{% endblock %}

{% block extra_js %}
<script>
function copyMessage() {
    const messageContent = document.getElementById('message-content').innerText;
    navigator.clipboard.writeText(messageContent).then(function() {
        alert('消息已复制到剪贴板!');
    }, function(err) {
        console.error('无法复制: ', err);
    });
}
</script>
{% endblock %}
