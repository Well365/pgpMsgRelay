{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans '消息已被查看' %} | {% trans 'OpenPGP 中转站' %}{% endblock %}

{% block content %}
<h2 class="mb-4">{% trans '消息已被查看' %}</h2>

<div class="alert alert-warning">
    <p>{% trans '很抱歉，此一次性消息已被查看，无法再次访问。' %}</p>
</div>

<p>{% trans '一次性消息在第一次被成功访问后会立即销毁，以确保数据安全。' %}</p>

<div class="mt-4">
    <a href="{% url 'message_agent:create_message' %}" class="btn btn-primary">{% trans '创建新消息' %}</a>
</div>
{% endblock %}
