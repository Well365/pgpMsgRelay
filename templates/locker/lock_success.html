<!DOCTYPE html>
<html>
<head>
    <title>锁定指令已发送 - {{ device_id }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f5f7;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .success-icon {
            color: #34c759;
            font-size: 60px;
            margin: 20px 0;
        }
        .device-id {
            font-family: monospace;
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            margin: 15px 0;
            word-break: break-all;
        }
        .back-link {
            margin-top: 20px;
            color: #007aff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>锁定指令已发送</h1>
        <div class="success-icon">✓</div>
        <p>成功发送锁定指令到以下 Mac 设备:</p>
        <div class="device-id">{{ device_id }}</div>
        <p>Mac 设备将在下次检查时（通常在30秒内）自动锁定。</p>
        
        <a href="{% url 'lock_page' device_id=device_id %}" class="back-link">返回到锁定页面</a>
    </div>
</body>
</html>
